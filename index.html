<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparte tus fotos · XV Años Mariana</title>
<meta name="description" content="Sube las fotografías que tomaste en los XV años de Mariana">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="backdrop">
  <main class="invitation">
    <img class="layer" src="assets/Fondo2.png" alt="" aria-hidden="true">
    <img class="layer layer--flowers" src="assets/EsquinasFlorales2.png" alt="" aria-hidden="true">
    <div class="frame-border frame-border--outer" aria-hidden="true"></div>
    <div class="frame-border frame-border--inner" aria-hidden="true"></div>

    <div class="content" id="content">
      <header class="intro">
        <h1 class="script-xl">Comparte tus fotos</h1>
        <p class="script-lg">XV Años · Mariana</p>
        <p class="message-text message-text--sm" id="instructions">
          Elige desde tu galería las fotografías que tomaste durante la fiesta y súbelas para que Mariana las conserve como recuerdo.
        </p>
        <p class="limits-note" id="limitsNote">
          hasta <span data-limit="maxFileBytes"></span> por foto · máximo <span data-limit="maxFiles"></span> fotos por envío
        </p>
      </header>

      <input class="visually-hidden" id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple tabindex="-1" aria-hidden="true">

      <!-- Mensajes de estado: el primero se anuncia sin interrumpir; el
           segundo (errores / archivos rechazados) se anuncia de inmediato. -->
      <div class="status" id="status" role="status" aria-live="polite">
        <p class="status-text" id="statusText"></p>
        <progress class="status-progress" id="statusProgress" max="1" value="0" hidden></progress>
      </div>
      <div class="notice" id="notice" role="alert" hidden>
        <p class="notice-title" id="noticeTitle"></p>
        <ul class="notice-list" id="noticeList"></ul>
      </div>

      <ul class="photo-grid" id="photoGrid" aria-label="Fotografías seleccionadas"></ul>

      <div class="actions" id="actions">
        <button class="pill pill--wide" id="uploadBtn" type="button" hidden>Subir fotos</button>
        <button class="pill pill--wide" id="pickBtn" type="button" aria-describedby="limitsNote">Elegir fotos</button>
        <button class="next-link" id="addMoreBtn" type="button" hidden>Agregar más fotos</button>
        <button class="next-link" id="clearBtn" type="button" hidden>Quitar todas</button>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/uploader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
